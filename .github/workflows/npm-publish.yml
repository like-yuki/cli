# Build platform binaries, upload to GitHub Release, then publish npm package.

name: Build & Publish

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '**.js'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            npm_dir: cli-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            npm_dir: cli-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            npm_dir: cli-darwin-arm64
          - os: ubuntu-latest
            target: bun-windows-x64
            npm_dir: cli-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build binaries for ${{ matrix.target }}
        run: node scripts/build.js ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_dir }}
          path: npm/${{ matrix.npm_dir }}/bin/

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp "artifacts/cli-linux-x64/lk" release-assets/lk-linux-x64
          cp "artifacts/cli-linux-x64/lk-gpa" release-assets/lk-gpa-linux-x64
          cp "artifacts/cli-linux-x64/lk-pp" release-assets/lk-pp-linux-x64

          cp "artifacts/cli-linux-arm64/lk" release-assets/lk-linux-arm64
          cp "artifacts/cli-linux-arm64/lk-gpa" release-assets/lk-gpa-linux-arm64
          cp "artifacts/cli-linux-arm64/lk-pp" release-assets/lk-pp-linux-arm64

          cp "artifacts/cli-darwin-arm64/lk" release-assets/lk-darwin-arm64
          cp "artifacts/cli-darwin-arm64/lk-gpa" release-assets/lk-gpa-darwin-arm64
          cp "artifacts/cli-darwin-arm64/lk-pp" release-assets/lk-pp-darwin-arm64

          cp "artifacts/cli-win32-x64/lk.exe" release-assets/lk-win32-x64.exe
          cp "artifacts/cli-win32-x64/lk-gpa.exe" release-assets/lk-gpa-win32-x64.exe
          cp "artifacts/cli-win32-x64/lk-pp.exe" release-assets/lk-pp-win32-x64.exe

          chmod +x release-assets/* 2>/dev/null || true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          TAG="v${VERSION}"
          TITLE="Release ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --title "${TITLE}" --notes "Automated release for ${TAG}"
          fi

  publish-main:
    needs: release-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify npm auth
        run: |
          npm whoami
          npm ping

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
